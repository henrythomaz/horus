services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: analista
      POSTGRES_PASSWORD: Horus2026
      POSTGRES_DB: horus_bd

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  redis:
    image: redis:7-alpine

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: ../../apps/api

    env_file:
      - ../../apps/api/app/.env

    environment:
      REDIS_URL: redis://redis:6379/0
      YOLO_BATCH_SIZE: 4

    ports:
      - "8000:8000"

    volumes:
      - horus_storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    build:
      context: ../../apps/api

    env_file:
      - ../../apps/api/app/.env

    environment:
      REDIS_URL: redis://redis:6379/0
      YOLO_BATCH_SIZE: 4

    volumes:
      - horus_storage:/app/storage

    entrypoint:
      - uv
      - run

    command:
      [
        "rq",
        "worker",
        "image_processing",
        "--url",
        "redis://redis:6379/0"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - api


volumes:
  postgres_data:
  redis_data:
  horus_storage:
