services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: analista
      POSTGRES_PASSWORD: Horus2026
      POSTGRES_DB: horus_bd

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build:
      context: ../../apps/api

    env_file:
      - ../../apps/api/app/.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - api


volumes:
  postgres_data:
